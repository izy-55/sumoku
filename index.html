<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumoku</title>

  <style>
    :root{
      --cell: 72px;     /* גודל משבצת בדסקטופ */
      --outer: 3px;
      --inner: 1px;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      background:#fff;
    }

    .wrap{
      width:100%;
      max-width:900px;
      padding:20px 16px 30px;
      text-align:center;
    }

    .title{
      font-size:56px;
      font-weight:900;
      letter-spacing:3px;
      margin:10px 0 20px;
    }

    /* כל כרטיס בשורה נפרדת */
    .card{
      display:block;
      width:fit-content;
      margin:0 auto;
      text-decoration:none;
      color:#000;
    }

    /* לוח עם Overlay */
    .stage{
      position:relative;
      display:block;
      width:fit-content;
      margin:0 auto;
      border:var(--outer) solid #000;
      background:#fff;
    }

    .grid{
      display:grid;
    }

    .stage.five .grid{
      grid-template-columns:repeat(5, var(--cell));
    }

    .stage.seven .grid{
      grid-template-columns:repeat(7, var(--cell));
    }

    .cell{
      width:var(--cell);
      height:var(--cell);
      border:var(--inner) solid #000;
      box-sizing:border-box;
    }

    .y{ background:#ff0; }
    .g{ background:#83e28e; }

    /* טקסט מעל הלוח */
    .overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:80px;
      font-weight:900;
      letter-spacing:2px;
      pointer-events:none;
      text-shadow:3px 3px 0 #0006;
    }

    /* כותרת אמצעית */
    .mid{
      margin:22px auto;
      display:block;
      width:fit-content;
      padding:14px 44px;
      border:2px solid #000;
      font-size:56px;
      font-weight:900;
      letter-spacing:3px;
      background:transparent; /* אפשר לצבוע אם רוצים */
    }

    /* מובייל */
    @media (max-width: 560px){
      :root{ --cell: 46px; }
      .title{ font-size:42px; margin-bottom:14px; }
      .overlay{ font-size:56px; }
      .mid{ font-size:44px; padding:12px 28px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="title">SUMOKU</div>

    <!-- 5x5 -->
    <a class="card" href="./game-5x5.html" aria-label="Play 5x5">
      <div class="stage five">
        <div class="grid">
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        </div>
        <div class="overlay">5×5</div>
      </div>
    </a>

    <!-- SUMOKU באמצע -->
    <div class="mid">SUMOKU</div>

    <!-- 7x7 -->
    <a class="card" href="./game-7x7.html" aria-label="Play 7x7">
      <div class="stage seven">
        <div class="grid">
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        </div>
        <div class="overlay">7×7</div>
      </div>
    </a>

  </div>
</body>
</html>
