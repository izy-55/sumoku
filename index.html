<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sumoku 7x7 (Clean)</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <style>
    body{
      font-family: Arial, sans-serif;
      margin: 16px;
      text-align: center;
    }

    /* Version badge (so we always know what loaded) */
    .ver {
      position: fixed;
      top: 8px;
      left: 8px;
      background: #fff;
      border: 1px solid #ccc;
      padding: 2px 6px;
      font-size: 12px;
      opacity: 0.85;
      z-index: 99999;
    }

    /* Board */
    table{
      border-collapse: collapse;
      margin: 12px auto;
      border: 3px solid #444;        /* outer frame (THICK) */
      border-radius: 4px;
    }
    td{
      width: 44px;
      height: 44px;
      border: 1px solid #aaa;        /* inner thin lines */
      text-align: center;
      vertical-align: middle;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }

    /* Thick outer lines for table edges */
    table tr:first-child td { border-top: 3px solid #444; }
    table tr:last-child  td { border-bottom: 3px solid #444; }
    table tr td:first-child { border-left: 3px solid #444; }
    table tr td:last-child  { border-right: 3px solid #444; }

    /* Simple UI */
    .row{
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    button{
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .hint{
      opacity: 0.7;
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="ver">CLEAN-INDEX (thick frame = 3px)</div>

  <h2>Sumoku 7×7</h2>

  <div class="row">
    <button id="btnNew">New Board</button>
    <button id="btnClear">Clear</button>
  </div>

  <div id="boardWrap"></div>
  <div class="hint">This is a clean build: no redirects, no service worker (for now).</div>

  <script>
    // --- IMPORTANT: kill old Service Workers (from previous experiments) ---
    // This prevents "ghost versions" on mobile.
    (function unregisterOldServiceWorkers(){
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.getRegistrations()
        .then(regs => regs.forEach(r => r.unregister()))
        .catch(() => {});
    })();

    // --- Minimal 7x7 board demo (placeholder logic) ---
    // We'll replace with your real Sumoku logic after everything loads cleanly.
    const SIZE = 7;

    function renderBoard(){
      const wrap = document.getElementById("boardWrap");
      const table = document.createElement("table");

      for (let r = 0; r < SIZE; r++){
        const tr = document.createElement("tr");
        for (let c = 0; c < SIZE; c++){
          const td = document.createElement("td");
          td.textContent = ""; // empty cell
          td.addEventListener("click", () => {
            td.textContent = td.textContent ? "" : "•";
          });
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }

      wrap.innerHTML = "";
      wrap.appendChild(table);
    }

    document.getElementById("btnNew").addEventListener("click", renderBoard);
    document.getElementById("btnClear").addEventListener("click", () => {
      document.querySelectorAll("td").forEach(td => td.textContent = "");
    });

    renderBoard();
  </script>
</body>
</html>
