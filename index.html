<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sumoku</title>

  <style>
    body{font-family:Arial,sans-serif;margin:0;display:flex;justify-content:center}
    .wrap{max-width:520px;width:100%;padding:24px 18px;text-align:center}
    h1{margin:10px 0 18px;font-size:48px;letter-spacing:2px}
    .card{display:block;text-decoration:none;color:inherit;margin:18px auto}
    .board{
      width:100%;
      border:3px solid #000;
      display:grid;
      gap:0;
      box-sizing:border-box;
      background:#0000;
    }
    .cell{aspect-ratio:1/1;border:1px solid #000}
    .y{background:#ff0}
    .g{background:#83e28e}
    .label{
      margin:14px auto 0;
      font-size:64px;
      font-weight:800;
      text-shadow: 3px 3px 0 #0006;
    }
    .mid{
      margin:18px 0;
      padding:18px 0;
      background:#f7c6d8;
      border:2px solid #000;
      font-size:52px;
      font-weight:900;
      letter-spacing:3px;
    }
    .hint{margin-top:10px;color:#444;font-size:14px}
  </style>
</head>

<body>
  <div class="wrap">
    <a class="card" href="./game-5x5.html" aria-label="Play 5x5">
      <div class="board" style="grid-template-columns:repeat(5,1fr)">
        <!-- 5x5 checker -->
        <script>
          for(let i=0;i<25;i++){
            const d=document.createElement('div');
            d.className='cell '+(((Math.floor(i/5)+i)%2===0)?'y':'g');
            document.currentScript.parentElement.appendChild(d);
          }
        </script>
      </div>
      <div class="label">5×5</div>
    </a>

    <div class="mid">SUMOKU</div>

    <a class="card" href="./game-7x7.html" aria-label="Play 7x7">
      <div class="board" style="grid-template-columns:repeat(7,1fr)">
        <!-- 7x7 checker -->
        <script>
          for(let i=0;i<49;i++){
            const d=document.createElement('div');
            d.className='cell '+(((Math.floor(i/7)+i)%2===0)?'y':'g');
            document.currentScript.parentElement.appendChild(d);
          }
        </script>
      </div>
      <div class="label">7×7</div>
    </a>

    <div class="hint">Choose a board size to start.</div>
  </div>
</body>
</html>
