<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumoku</title>

  <style>
    :root{
      --cell: 72px;     /* גודל משבצת דסקטופ */
      --outer: 3px;
      --inner: 1px;
      --gap: 26px;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      background:#fff;
    }

    .wrap{
      width:100%;
      max-width:900px;
      padding:18px 16px 28px;
      text-align:center;
    }

    .title{
      margin:6px 0 18px;
      font-size:52px;
      letter-spacing:3px;
      font-weight:900;
    }

    .card{
      display:inline-block;
      text-decoration:none;
      color:#000;
      margin:0 auto;
    }

    /* "לוח" עם שכבת טקסט מעליו */
    .stage{
      position:relative;
      display:inline-block;   /* מתכווץ לרוחב הלוח */
      border:var(--outer) solid #000;
      background:#fff;
    }

    .grid{ display:grid; }
    .stage.five .grid{ grid-template-columns:repeat(5, var(--cell)); }
    .stage.seven .grid{ grid-template-columns:repeat(7, var(--cell)); }

    .cell{
      width:var(--cell);
      height:var(--cell);
      border:var(--inner) solid #000;
      box-sizing:border-box;
    }
    .y{ background:#ff0; }
    .g{ background:#83e28e; }

    /* Overlay טקסט */
    .overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:78px;
      font-weight:900;
      letter-spacing:2px;
      pointer-events:none; /* שלא יפריע ללחיצה על הקישור */
      text-shadow: 3px 3px 0 #0006; /* אפשר למחוק אם לא רוצים צל */
    }

    /* פס אמצעי "SUMOKU" */
    .mid{
      margin:18px auto;
      display:inline-block;
      padding:14px 42px;
      border:2px solid #000;
      font-size:56px;
      font-weight:900;
      letter-spacing:3px;
      background:transparent; /* אפשר לשנות ל-#f7c6d8 אם תרצה ורוד */
    }

    .spacer{ height: var(--gap); }

    @media (max-width: 560px){
      :root{ --cell: 46px; }
      .title{ font-size:40px; margin-bottom:12px; }
      .overlay{ font-size:56px; }
      .mid{ font-size:44px; padding:12px 28px; }
      .spacer{ height: 18px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="title">SUMOKU</div>

    <a class="card" href="./game-5x5.html" aria-label="Play 5x5">
      <div class="stage five">
        <div class="grid">
          <!-- 25 cells -->
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        </div>
        <div class="overlay">5×5</div>
      </div>
    </a>

    <div class="mid">SUMOKU</div>

    <a class="card" href="./game-7x7.html" aria-label="Play 7x7">
      <div class="stage seven">
        <div class="grid">
          <!-- 49 cells -->
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
          <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
          <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        </div>
        <div class="overlay">7×7</div>
      </div>
    </a>

    <div class="spacer"></div>

  </div>
</body>
</html>
