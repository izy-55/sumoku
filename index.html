<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumoku</title>

  <style>
    :root{
      --cell: 72px;      /* גודל משבצת בדסקטופ */
      --outer: 3px;
      --inner: 1px;
      --gap: 26px;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      background:#fff;
    }

    .wrap{
      width:100%;
      max-width:900px;
      padding:18px 16px 28px;
      text-align:center;
    }

    h1{
      margin:10px 0 14px;
      font-size:52px;
      letter-spacing:3px;
    }

    /* הכרטיס עצמו מתכווץ/מתרחב לפי הלוח (במקום 100% רוחב) */
    .card{
      display:inline-block;
      text-decoration:none;
      color:#000;
      margin:14px auto 0;
    }

    .board{
      border:var(--outer) solid #000;
      display:grid;
      box-sizing:border-box;
      background:#fff;
      margin:0 auto;
    }

    .board.five{
      grid-template-columns:repeat(5, var(--cell));
    }
    .board.seven{
      grid-template-columns:repeat(7, var(--cell));
    }

    .cell{
      width:var(--cell);
      height:var(--cell);
      border:var(--inner) solid #000;
      box-sizing:border-box;
    }

    .y{ background:#ff0; }
    .g{ background:#83e28e; }

    /* טקסט ממורכז בדיוק ביחס לרוחב הכרטיס (שהוא רוחב הלוח) */
    .label{
      margin:12px 0 0;
      font-size:56px;
      font-weight:900;
      letter-spacing:2px;
      text-align:center;
      text-shadow: 3px 3px 0 #0006;
    }

    .spacer{ height: var(--gap); }

    /* מובייל: משבצות קטנות יותר */
    @media (max-width: 560px){
      :root{ --cell: 46px; }
      h1{ font-size:40px; margin-bottom:10px; }
      .label{ font-size:44px; }
      .spacer{ height: 18px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>SUMOKU</h1>

    <a class="card" href="./game-5x5.html" aria-label="Play 5x5">
      <div class="board five">
        <!-- 25 cells -->
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
      </div>
      <div class="label">5×5</div>
    </a>

    <div class="spacer"></div>

    <a class="card" href="./game-7x7.html" aria-label="Play 7x7">
      <div class="board seven">
        <!-- 49 cells -->
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
      </div>
      <div class="label">7×7</div>
    </a>

  </div>
</body>
</html>
