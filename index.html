<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sumoku</title>

  <!-- Mobile / PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.json">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      text-align: center;
    }

    .container {
      max-width: 360px;
      margin: 0 auto;
      padding: 20px 10px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 30px;
    }

    .card {
      text-decoration: none;
      color: black;
      display: block;
    }

    .stage {
      position: relative;
      margin: 0 auto;
      width: 180px;
      height: 180px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border: 2px solid black;
    }

    .stage.seven {
      grid-template-columns: repeat(7, 1fr);
      width: 210px;
      height: 210px;
    }

    .cell {
      background: #9be59b;
    }
    .cell.alt {
      background: yellow;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      color: black;
      text-shadow: 2px 2px 0 #3a3a3a;
    }

    @media (max-width: 420px) {
      .stage { width: 150px; height: 150px; }
      .stage.seven { width: 180px; height: 180px; }
      .overlay { font-size: 32px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="title">SUMOKU</div>

    <div class="cards">

      <!-- 5x5 -->
      <a class="card" href="./game-5x5.html" aria-label="Play 5x5">
        <div class="stage">
          <!-- 25 cells -->
          <script>
            for (let i = 0; i < 25; i++) {
              document.write(`<div class="cell ${i % 2 ? 'alt' : ''}"></div>`);
            }
          </script>
          <div class="overlay">5×5</div>
        </div>
      </a>

      <!-- 7x7 -->
      <a class="card" href="./game-7x7.html" aria-label="Play 7x7">
        <div class="stage seven">
          <!-- 49 cells -->
          <script>
            for (let i = 0; i < 49; i++) {
              document.write(`<div class="cell ${i % 2 ? 'alt' : ''}"></div>`);
            }
          </script>
          <div class="overlay">7×7</div>
        </div>
      </a>

    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
