<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumoku</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      min-height:100vh;
      background:#fff;
    }

    .wrap{
      width:100%;
      max-width:520px;
      padding:24px 16px;
      text-align:center;
    }

    h1{
      margin:12px 0 28px;
      font-size:48px;
      letter-spacing:3px;
    }

    .card{
      display:block;
      text-decoration:none;
      color:#000;
      margin:24px auto;
    }

    .board{
      width:100%;
      aspect-ratio:1 / 1;
      border:3px solid #000;
      display:grid;
    }

    .board.five{ grid-template-columns:repeat(5,1fr); }
    .board.seven{ grid-template-columns:repeat(7,1fr); }

    .cell{
      border:1px solid #000;
    }

    .y{ background:#ff0; }
    .g{ background:#83e28e; }

    .label{
      margin-top:14px;
      font-size:56px;
      font-weight:800;
      letter-spacing:2px;
    }

    .hint{
      margin-top:18px;
      font-size:14px;
      color:#444;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>SUMOKU</h1>

    <a class="card" href="./game-5x5.html" aria-label="Play 5x5">
      <div class="board five">
        <!-- 25 cells -->
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
      </div>
      <div class="label">5×5</div>
    </a>

    <a class="card" href="./game-7x7.html" aria-label="Play 7x7">
      <div class="board seven">
        <!-- 49 cells -->
        <!-- שורה 1 -->
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <!-- שורה 2 -->
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <!-- שורה 3 -->
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <!-- שורה 4 -->
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <!-- שורה 5 -->
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
        <!-- שורה 6 -->
        <div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div>
        <!-- שורה 7 -->
        <div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div><div class="cell g"></div><div class="cell y"></div>
      </div>
      <div class="label">7×7</div>
    </a>

    <div class="hint">Choose a board size to start</div>

  </div>
</body>
</html>
